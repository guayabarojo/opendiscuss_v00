# Render Blueprint for OpenDiscuss
# Deploy with: Connect GitHub repo to Render and it auto-detects this file

services:
  # Backend API
  - type: web
    name: opendiscuss-backend
    runtime: python
    region: oregon
    plan: starter  # Free tier
    buildCommand: "cd backend && pip install -r requirements.txt && alembic upgrade head"
    startCommand: "cd backend && uvicorn src.main:app --host 0.0.0.0 --port $PORT --workers 2"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: opendiscuss-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: opendiscuss-redis
          type: redis
          property: connectionString
      - key: PYTHON_VERSION
        value: "3.11"
      - key: OPENAI_API_KEY
        sync: false  # Set manually in dashboard
      - key: ANTHROPIC_API_KEY
        sync: false  # Set manually in dashboard
      - key: CORS_ORIGINS
        value: "*"  # Update to your Vercel domain after deployment
      - key: ENV
        value: "production"
    healthCheckPath: /health
    autoDeploy: true

  # Redis for caching and sessions
  - type: redis
    name: opendiscuss-redis
    plan: starter  # Free tier
    maxmemoryPolicy: allkeys-lru
    ipAllowList: []  # Empty = allow all

databases:
  # PostgreSQL with pgvector
  - name: opendiscuss-db
    databaseName: opendiscuss
    user: opendiscuss
    plan: starter  # Free tier with 256MB
    postgresMajorVersion: 15
    ipAllowList: []  # Empty = allow all
