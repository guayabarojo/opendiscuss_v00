<!DOCTYPE html>
<html>
<head>
    <title>Test Create Page</title>
    <script>
        // Simple test to check if page loads
        window.addEventListener('load', function() {
            console.log('Page loaded');
            setTimeout(function() {
                const errors = [];
                const root = document.getElementById('root');

                if (!root) {
                    errors.push('ERROR: #root element not found');
                } else if (!root.innerHTML || root.innerHTML.trim() === '') {
                    errors.push('ERROR: #root is empty - WHITE SCREEN');
                } else {
                    console.log('SUCCESS: Content found in #root');
                    console.log('Content preview:', root.innerHTML.substring(0, 200));
                }

                if (errors.length > 0) {
                    alert('ERRORS FOUND:\\n' + errors.join('\\n'));
                } else {
                    alert('Page loaded successfully!');
                }
            }, 2000);
        });
    </script>
</head>
<body>
    <h1>Loading Create Discussion Page...</h1>
    <iframe src="http://localhost:3000/discussions/create" width="100%" height="600" style="border: 1px solid #ccc;"></iframe>
</body>
</html>
